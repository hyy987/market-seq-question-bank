<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>2026 市场序列考试在线题库（5套卷）</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", "Source Han Sans SC", sans-serif;
  background: #eef2f8; color: #2c3e50; line-height: 1.7; font-size: 15px;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 18px 16px 80px; }
.header {
  background: linear-gradient(135deg, #0b3f8f, #2b6de8); color: #fff;
  border-radius: 14px; padding: 22px 28px; margin-bottom: 16px;
}
.header h1 { font-size: 22px; margin-bottom: 6px; }
.header p { font-size: 14px; opacity: .9; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
.tab {
  padding: 8px 16px; background: #fff; border: 1px solid #c9d4e6; border-radius: 20px;
  cursor: pointer; font-size: 14px; color: #0b3f8f; user-select: none; transition: all .2s;
}
.tab:hover { border-color: #2b6de8; }
.tab.active { background: #0b3f8f; color: #fff; border-color: #0b3f8f; font-weight: 700; }
.paper-desc {
  background: #fff8e6; border-left: 4px solid #f0b429; border-radius: 0 8px 8px 0;
  padding: 10px 14px; font-size: 13.5px; color: #6b5317; margin-bottom: 14px;
}

/* 题块 */
.section-title {
  font-size: 18px; color: #0b3f8f; font-weight: 700; margin: 26px 0 10px;
  padding: 8px 12px; background: #e8f0fe; border-radius: 8px;
  display: flex; justify-content: space-between; align-items: center;
}
.q-card {
  background: #fff; border: 1px solid #dde5f0; border-radius: 10px; padding: 14px 18px; margin: 10px 0;
}
.q-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.q-no { font-weight: 700; color: #0b3f8f; margin-right: 8px; white-space: nowrap; }
.q-text { flex: 1; text-align: justify; }
.q-type { font-size: 12px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
.type-single { background: #e6f7ed; color: #1a7f37; }
.type-multi { background: #fff0e6; color: #c2600a; }
.type-essay { background: #eef0ff; color: #3b4cc0; }
.opts { margin: 6px 0 2px; }
.opt {
  display: flex; align-items: flex-start; padding: 6px 8px; margin: 3px 0; border-radius: 8px;
  cursor: pointer; transition: background .15s; border: 1px solid transparent;
}
.opt:hover { background: #f0f5ff; }
.opt input { margin-right: 8px; margin-top: 4px; }
.opt span { flex: 1; text-align: justify; }
.opt.is-multi { display: block; }

/* 批改后状态 */
.q-card.correct { border-color: #5cb85c; background: #f4fbf4; }
.q-card.wrong { border-color: #d9534f; background: #fdf5f5; }
.opt.opt-correct { background: #dff0d8; }
.opt.opt-wrong { background: #f2dede; }
.result-badge { font-size: 13px; font-weight: 700; padding: 1px 10px; border-radius: 12px; }
.badge-correct { background: #5cb85c; color: #fff; }
.badge-wrong { background: #d9534f; color: #fff; }
.explain {
  margin-top: 8px; padding: 10px 12px; border-radius: 8px; background: #f8f9fb;
  border: 1px dashed #c3cede; font-size: 14px; display: none;
}
.q-card.graded .explain { display: block; }
.explain .ans-line { color: #0b3f8f; font-weight: 700; margin-bottom: 4px; }
.explain .ans-line.wrong { color: #c2272d; }
.explain .ans-line.correct { color: #1a7f37; }
.essay-area { width: 100%; min-height: 90px; border: 1px solid #c9d4e6; border-radius: 8px; padding: 8px 10px; font-size: 14px; font-family: inherit; resize: vertical; }
.essay-score { margin-top: 6px; display: flex; align-items: center; gap: 8px; font-size: 14px; }
.essay-score input { width: 70px; padding: 4px 6px; border: 1px solid #c9d4e6; border-radius: 6px; }

/* 底部操作 */
.toolbar {
  position: sticky; bottom: 0; background: rgba(255,255,255,.96); border-top: 1px solid #dde5f0;
  padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
  margin-top: 24px; border-radius: 12px 12px 0 0; box-shadow: 0 -4px 16px rgba(20,40,80,.06);
}
.progress { font-size: 14px; color: #4a5c75; }
.btn {
  padding: 9px 22px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer;
  transition: all .2s; font-weight: 700;
}
.btn-primary { background: #0b3f8f; color: #fff; }
.btn-primary:hover { background: #123d7e; }
.btn-secondary { background: #e8f0fe; color: #0b3f8f; }
.btn-secondary:hover { background: #dbe7ff; }
.btn-danger { background: #c2272d; color: #fff; }
.btn-danger:hover { background: #a01f23; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* 成绩报告 */
.report {
  background: #fff; border: 2px solid #0b3f8f; border-radius: 14px; padding: 26px 30px; margin: 24px 0;
}
.report h2 { color: #0b3f8f; font-size: 20px; margin-bottom: 12px; text-align: center; }
.score-line { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin: 10px 0 16px; }
.score-box {
  text-align: center; padding: 12px 18px; border-radius: 12px; background: #f0f5ff; min-width: 120px;
}
.score-box .num { font-size: 28px; font-weight: 800; color: #0b3f8f; }
.score-box .label { font-size: 13px; color: #4a5c75; }
.score-box.pass .num { color: #1a7f37; }
.score-box.fail .num { color: #c2272d; }
.mistake-list { margin: 12px 0; }
.mistake-item { padding: 6px 0; border-bottom: 1px dashed #e0e6f0; font-size: 14px; }
.mistake-item a { color: #1a5fd0; text-decoration: none; }
.mistake-item a:hover { text-decoration: underline; }
.action-row { text-align: center; margin-top: 16px; }
.hidden { display: none; }
.note { font-size: 12.5px; color: #7a8aa0; margin-top: 4px; }
.footer { text-align: center; color: #8a96a8; font-size: 12.5px; margin-top: 26px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>2026 市场序列考试（网格及渠道运营方向）在线题库</h1>
    <p>5 套模拟卷 · 每套：单选 30 题×1 分 / 多选 30 题×2 分 / 简答 1 题×10 分 = 满分 100 分</p>
    <p style="font-size:13px;opacity:.85;">批改规则：单选全对 1 分；多选全对 2 分、漏选（无错选）1 分、有错选 0 分；简答为主观题，对照参考答案要点自评（0-10 分）</p>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="paper-desc" class="paper-desc"></div>
  <div id="paper"></div>
  <div id="report" class="report hidden"></div>
  <div class="toolbar">
    <div class="progress" id="progress">未作答 0 / 61</div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-secondary" id="btn-clear" onclick="resetPaper()">重做本卷</button>
      <button class="btn btn-primary" id="btn-submit" onclick="grade()">提交批改</button>
      <button class="btn btn-danger hidden" id="btn-retry" onclick="resetPaper(false)">再做一次</button>
    </div>
  </div>
  <div class="footer">题库依据《2026 年市场序列-知识指引手册（市场领域专业）》与 0901 版考试大纲编制 · 供备考练习使用</div>
</div>

  essay: {q:'简述中国移动渠道体系规划蓝图「店+网+人」三位一体的内涵，以及 2025 年底「店网人」重点业务占比目标。', ref:'（1）店为根：自有营业厅是压舱石，定位数字生活体验中心；社会渠道聚焦商圈、校园、社区三类重点区域，农村实现「一乡镇一网点、一村一代理」。（2）网为本：以中国移动 APP 为核心构建「1 端+3 号」（APP+微信公众号、支付宝服务号、抖音号）自有电子渠道，客户渗透率不低于 70%，建成 3 亿级入口；强化热线、外部渠道与创新型渠道（企业微信私域、智慧短信）。（3）人为先：锻造直销（按 1:5000 配比）与随销（9.5 万人，黄金入户权）精准触客生力军。（4）2025 年底目标：店、网、人重点业务占比由倒三角 57%/31%/12% 优化为纺锤形 30%/50%/20%，线上渗透率突破 70%，一线人员数智化支撑满意度不低于 85 分。', points:['答出店为根内涵（自有厅压舱石、数字生活体验中心）','答出网为本内涵（APP 为核心、1端+3号、渗透率70%）','答出人为先内涵（直销/随销、1:5000）','答出占比从 57/31/12 调整为 30/50/20、线上渗透率70%']}},

  essay: {q:'简述销售合作伙伴违规行为的 A 类与 B 类划分，以及涉 A 类违规渠道的治理要求。', ref:'（1）A 类=重点治理违规行为，共 10 项：未落实实名制、截留泄露客户信息、违规外呼、未经客户允许开通业务/更改规则、养卡套利、虚假承诺宣传、线下充值权限外流、涉嫌电信诈骗、利用漏洞套利等。（2）B 类=其他禁止性要求，违反 B 类视情节依规处理。（3）治理机制：A 类违规或违反省公司禁止性制度被解除合作的，录入「不良信用信息库」，2 年内不得新引入，2 年期满自动退出（60 个月内系统保留记录）。（4）处罚手段：警告降级、暂停合作、强制退出；侵犯客户权益的违规扣罚不低于 500 元/例；A 类违规造成恶劣影响或整改不达标的强制退出。', points:['答出 A 类定义并列举至少 5 项 A 类违规','答出 B 类定义','答出不良信用信息库 2 年不得新引入','答出处罚手段（警告降级/暂停合作/强制退出）']}

{q:'随销队伍「网格 PK 激励」的触发条件包括（　）。', opts:['装维责任区与市场网格一对多对齐','装维人员入格（大型≥4/中型≥2/小型≥1）','人均月产能≥10 笔','网格排名后 20% 也有激励'], ans:['ABC'], exp:'网格 PK 触发：责任区对齐、人员入格达标、人均月产能≥10 笔；仅大中小前 50% 有激励，排名后段无激励。'},
{q:'随销队伍「商机转化率」提升的支撑手段包括（　）。', opts:['简化商机看板','网格通融合 2.0','AI 工牌监测合规','扩大外呼频次'], ans:['ABC'], exp:'支撑工具：简化商机看板、网格通融合 2.0、AI 工牌监测执行合规；扩大外呼频次违反外呼管控要求。'},
{q:'2026 年线上渠道「做大 APP 日活」的手段包括（　）。', opts:['焕新基础通信','做深营销活动','数智生活场景','跨境商城'], ans:['ABC'], exp:'做大日活三手段：焕新基础通信提频次、营销活动增粘性、数智生活场景建心智；跨境商城不在此列。'},
{q:'商机「预约单」的特点是（　）。', opts:['用户主动填写','用户主动确认','根据诉求沟通跟进交付','系统自动生成'], ans:['AB'], exp:'预约单：用户主动填写或主动确认后，按用户诉求沟通跟进交付；意向单由运营挖掘产生，失败单由自助操作失败产生。'},

{q:'在线营销服务中心在中国移动 APP 运营中的职责包括（　）。', opts:['整体框架规划','设计规范制定','触点分配','客户投诉集中受理与转派'], ans:['ABCD'], exp:'在线营销服务中心：统一规划 APP 整体框架、设计规范、页面布局与触点分配，并负责投诉集中受理、溯源及转派。'},
{q:'2026 年 APP「聚焦重点业务打通关键流程」的号卡策略包括（　）。', opts:['融通线上线下号池','异网/靓号/专属号源精准策略','主副卡、预存合约、促销叠加','压降线上选号'], ans:['ABC'], exp:'号卡策略：号池融通保障线上选号、异网靓号专属号源策略、支持主副卡/预存合约/促销叠加上架；压降线上选号与战略相反。'},

  essay: {q:'简述随销队伍「1+3+N」激励体系的具体构成及「产能倍增激励」的计算逻辑。', ref:'（1）「1」：常规业务费用，保障随销人员基础业务办理报酬。（2）「3」：服营装维一体费用，包含三项激励——产能倍增激励（州市级）、网格 PK 激励（网格级）、装维个人激励（个人级）。（3）「N」：其他专项激励，如阶段性劳动竞赛、重点业务攻坚等。（4）产能倍增激励（州市级）逻辑：加载条件为目标完成率≥80% 或重点业务量≥28 笔的人数占比≥70% 任一达成；激励单价按商机转化率分档：10-13%→0.2 元、13-16%→0.4 元、16-20%→0.6 元、20% 及以上→0.8 元。', points:['答出「1」常规业务费用','答出「3」三项激励（产能倍增/网格PK/装维个人）','答出「N」专项激励','答出产能倍增达成条件与分档单价']}
},

    {q:'关于测试卡漫游，正确说法是（　）。', opts:['可全国漫游','原则上只允许省内漫游','可国际漫游','无漫游限制'], ans:'B', exp:'测试卡原则上只允许省内漫游；不得自行变更套餐或漫游范围。'},

    {q:'BOSS 角色互斥矩阵中，与营业员互斥的角色包括（　）。', opts:['网格主任','业务经理','厅经理','普通员工'], ans:['ABC'], exp:'营业员与网格主任、业务经理、厅经理等角色互斥，防止权限冲突与违规操作。'},
    {q:'有价卡销售管理规定正确的有（　）。', opts:['个人单月购卡限额 10000 元','集团客户年购卡总额原则上不超 100 万元','党政军客户不受上述限制','个人可无限制购买'], ans:['ABC'], exp:'个人 10000 元/月；集团 100 万/年（党政军不受限）；不允许无限制购买。'},
    {q:'业务办理三种确认方式包括（　）。', opts:['短信回复确认','含办理说明的手机验证码','签字确认','口头同意'], ans:['ABC'], exp:'三种确认：短信回复（端口限 10086/10085）、含办理说明的验证码、签字确认；口头同意不作为确认依据。'},
    {q:'工信部申诉判责「有责」情形包括（　）。', opts:['未发告知短信或内容不全','资费与公示不一致（2025年5月1日起）','宣传不全面隐瞒限制条件','如实清晰明示限制条款'], ans:['ABC'], exp:'有责情形：未发告知短信/内容不全、宣传与公示不一致、虚假承诺、隐瞒限制条件、自动续订未提前 5 日提醒等；如实明示则不判有责。'},
    {q:'自动续订合规要求包括（　）。', opts:['提前 5 日短信提醒','不得早于续费前 24 小时扣费','协议中显著提示','可无任何提醒'], ans:['ABC'], exp:'自动续订须提前至少 5 日提醒、扣费不早于续费前 24 小时、协议显著提示；无提醒则判有责。'},
    {q:'携号转网的受理条件包括（　）。', opts:['实名登记','正常使用状态','结清已出账费用','距上次携转满 120 自然日'], ans:['ABCD'], exp:'携转五条件：实名、正常使用、结清费用、满 120 自然日、无在网约定期限协议或已解除、不属于限制业务（固移融合/主副卡/家庭网等）。'},
    {q:'携号转网「六个严禁」包括（　）。', opts:['严禁设置考核指标','严禁设限阻碍携转','严禁违规宣传和针对性营销','严禁代客投诉和代客携转'], ans:['ABCD'], exp:'六个严禁全程覆盖：考核指标、设限阻碍、违规宣传、差异化优惠/酬金、缩小服务范围和过度风险提示、代客投诉/携转。'},
    {q:'资费公示的核心要素包括（　）。', opts:['方案编号、资费名称','资费标准、服务内容','有效期限、违约责任','在网要求、退订方式'], ans:['ABCD'], exp:'公示要素：编号、名称、类型、标准、服务内容、适用范围、期限、渠道、上下线时间、在网要求、退订方式、违约责任等，同页明示。'},
    {q:'可不备案公示的资费类型包括（　）。', opts:['权益原子/子活动','政企类资费','吉祥号码','内部活动'], ans:['ABCD'], exp:'白名单可销售：权益原子/子活动、政企、吉祥号码、内部活动；白名单由省公司市场经营部业务管理室资费公示负责人管理。'},
    {q:'资费公示字段规范正确的有（　）。', opts:['资费标准不得无内容','服务内容不能填 0 或无','有效期限不得写长期/2099/连续包月','公示总字数不超过 550 字'], ans:['ABCD'], exp:'各字段合规要求：标准必填、服务内容有效（勿 0/无/－）、期限非长期、总字数≤550；不得含省内/本地/校内/区域流量。'},
    {q:'资费「在网要求与违约责任」合规要求包括（　）。', opts:['0 元资费不得有在网要求及违约责任','除手机终端、特定智家产品补贴外均不得有','2026 年 10 月前解除在售资费在网要求及违约责任','违约责任可仅写「按约定赔付」'], ans:['ABC'], exp:'在网/违约：0 元资费不得有；终端及特定智家补贴除外、其余不得有；2026 年 10 月前解除；违约表述须明示金额或计算法，不得仅写「按约定赔付」。'},
    {q:'针对特定群体（学生、老年人、残疾人）资费的合规要求包括（　）。', opts:['不得作为政企资费管理','明确适用范围与办理条件','严格核验身份资质并留存信息','不得扩大销售范围'], ans:['ABCD'], exp:'特定群体资费：明确适用范围、办理条件，严格核验身份、留存信息、不得扩销；政企资费也不得面向公众销售（防外溢）。'},
{q:'测试卡申请流程的合规要点包括（　）。', opts:['通过 EIP-号卡管理-测试卡管理发起','上传集团或省公司发文依据','工作联系函有效','丢失及时报停'], ans:['ABD'], exp:'测试卡申请必须走 EIP 流程并上传发文依据；工作联系函不合规；丢失损坏及时报停、无需求主动解约注销。'},
{q:'吉祥号码销售管理要点包括（　）。', opts:['1-4 级可大众公开销售','5 级及以上政企专用','公众个人客户原则上不得申请 5 级及以上','所有等级均可公开销售'], ans:['ABC'], exp:'1-4 级低等级公开销售；5 级及以上用于政企维系与重点营销，公众个人客户原则上不得申请。'},
{q:'靓号保底争议的处理方式包括（　）。', opts:['合同≥20 年可取消保底','合同<20 年协商 1-9 折或取消保底','违约金=常规保底金额×未履约月数×90%','必须全额收取违约金'], ans:['ABC'], exp:'保底争议：≥20 年投诉可取消；<20 年协商折扣或取消，违约金=常规保底×未履约月数×90%；并非一律全额收。'},
{q:'AI豆兑换限制条件包括（　）。', opts:['入网未满 6 个月不可兑换','停机/预销户状态下冻结','销户清零','入网满 3 个月可兑换'], ans:['ABC'], exp:'AI豆兑换：入网 6 个月可兑、停机冻结、销户清零；3 个月不能兑换，D 错误。'},
{q:'非实名客户的告知与处理要求包括（　）。', opts:['告知一般≥30 天','特殊情况≥24 小时','BOSS 留存告知短信 5 年以上','先实名才能缴费'], ans:['ABCD'], exp:'非实名处理：告知期限 30 天（特例 24 小时）、BOSS 留存 5 年、先实名后缴费；预销号后仅沟通 100 厅，销号后不可复机。'},
{q:'有价卡销售合规要求包括（　）。', opts:['个人单月限额 10000 元','集团年度总额原则上不超 100 万元','党政军集团客户不受限','个人可单月购 5 万元'], ans:['ABC'], exp:'有价卡限额：个人 1 万/月、集团 100 万/年、党政军不受限；个人购 5 万违规。'},
{q:'工信部申诉判责中，对「自动续订」合规要求正确的有（　）。', opts:['至少提前 5 日短信提醒','扣费不得早于续费前 24 小时','协议中显著提示','无提醒直接扣费'], ans:['ABC'], exp:'自动续订：提前 5 日提醒、不早于 24 小时扣费、协议显著提示；无提醒扣费属有责。'},
{q:'携号转网的禁止业务类型包括（　）。', opts:['固移融合','主副卡','家庭网/亲情网','普通单卡'], ans:['ABC'], exp:'携转限制业务：固移融合、主副卡、家庭网/亲情网、共享业务、一卡双号、一号多终端等；普通单卡可携转。'},
{q:'资费公示「白名单」适用的资费包括（　）。', opts:['权益原子/子活动','政企类资费','吉祥号码','内部活动'], ans:['ABCD'], exp:'白名单（可备案后销售无需逐项公示）：权益原子/子活动、政企、吉祥号码、内部活动；白名单由省市场经营部业务管理室资费公示负责人管理。'},
{q:'针对特定群体（学生、老年人、残疾人）资费的合规要点包括（　）。', opts:['不得作为政企资费管理','明确适用范围与办理条件','严格核验身份资质并留存','不得扩大销售范围'], ans:['ABCD'], exp:'特定群体资费：不作为政企资费管理、明示适用范围与办理条件、严格核验身份并留存、不得扩销；政企资费不得面向公众销售防止外溢。'}

  essay: {q:'简述资费（含营销活动）公示的「公示范围与公示要素」，并说明「在网要求及违约责任」的合规要求。', ref:'（1）公示范围：面向公众客户销售的各类通信套餐（移动、宽带、固移融合等独立或组合套餐）、加装包（流量包、语音包、短彩信包等）和营销活动（不与套餐和加装包组合的业务赠送、充值活动、设备优惠等）。在售公众资费全量公示，未经公示不得销售（白名单资费除外）。（2）公示要素：方案编号、资费名称、资费类型、资费标准、服务内容、适用范围、有效期限、销售渠道、上下线时间、在网要求、退订方式、违约责任等，须清晰、易懂、醒目地在同一页面明示，不得隐瞒或淡化限制性条件。（3）在网要求及违约责任合规要求：a. 资费标准为 0 元的资费方案不得有在网要求及违约责任；b. 除手机终端、特定智家产品补贴等情况外，资费（含套餐、营销活动、加装包）均不得有在网要求及违约责任；c. 2026 年 10 月前需解除在售资费的在网要求及违约责任；d. 违约表述须明示具体赔付金额或计算方法，不得仅为「详询 100XX」「按约定赔付」。', points:['答出公示范围（套餐/加装包/营销活动）','答出全量公示原则与白名单','答出公示要素至少 5 项','答出 0 元资费不得有在网要求及违约','答出 2026 年 10 月解除时限']}
},
{id:'P5', name:'第 5 套卷', desc:'第 5 套：聚焦欠费管理、违约金减免、员工纪律处分、营销活动管理、三重一大、绩效办法等综合内容。', singles:[
    {q:'欠费是指客户（　）尚未缴纳的业务费用。', opts:['已经发生','准备发生','停产后发生','退订后发生'], ans:'A', exp:'欠费定义：客户已经发生尚未缴纳的业务费用；按付费模式分预付费、后付费、红名单三类。'},
    {q:'红名单客户由（　）负责管理。', opts:['市场经营部','政企客户部','网络部','客服部'], ans:'B', exp:'红名单客户由政企客户部负责管理；预付费为公众市场主要形式，后付费原则上只针对银行托收客户新增。'},
    {q:'后付费客户最迟交费日为每月（　）。', opts:['20 日','24 日','25 日','30 日'], ans:'B', exp:'后付费最迟交费日为每月 24 日，超过可限制通信；原则上个人后付费只针对银行托收客户新增提供。'},
    {q:'宽带客户每月（　）起执行实时欠费停机信控。', opts:['1 日','8 日','24 日','25 日'], ans:'B', exp:'宽带账户余额低于 0 元实时欠费停机，但为提升感知月初延迟停机：每月 8 日起执行实时欠费停机信控。'},
    {q:'融合宽带关联手机处于非开通但未销户状态时，宽带于（　）进入关联停机。', opts:['当日','次月 1 日','当月 25 日','第三个月'], ans:'B', exp:'融合宽带关联手机非开通未销户，宽带次月 1 日进入关联停机；裸宽不受手机侧信控影响。'},
    {q:'欠费信用受损用户体系的纳入标准是证件下所有号码欠费和违约金合计超过（　）。', opts:['100 元','200 元','500 元','1000 元'], ans:'B', exp:'欠费和违约金合计超 200 元纳入欠费信用受损用户体系（原黑名单）；结清前不得新开户、过户、主动销户。'},
    {q:'网龄信用额度针对（　）客户提供。', opts:['所有老客户','5 年以上非全球通客户','全球通客户','星级客户'], ans:'B', exp:'网龄信用额度针对 5 年以上非全球通客户；星级授信额度已停止新增服务（仅存量）；全球通按星级申请。'},
    {q:'下列可减免营销活动违约金的场景是（　）。', opts:['客户反悔不想用','凭证不满足服务承诺要求（未明确违约金金额）','未接听外呼电话','正常到期续约'], ans:'B', exp:'可减免七场景：不知情办理、凭证不满足服务承诺、七天无理由退订、合约期满自动续约、宽带在网变更档次自动解约、三黑涉及活动、其他特殊情况；其他情形不得减免。'},
    {q:'「三黑」（黑点业务、黑点渠道、黑点人员）涉及活动的违约金（　）。', opts:['不得减免','可系统查证后自动减免','一律不执行','人工查证减免'], ans:'B', exp:'违约金减免两种查证：人工查证（场景一、二、七）与系统查证（场景三、四、五、六）；「三黑」属系统自动查证减免。'},
    {q:'违约金减免适用「七天无理由退订」的营销活动的查证方式为（　）。', opts:['人工查证','系统查证自动减免','无需查证','人工复核'], ans:'B', exp:'七天无理由退订、自动续约、三黑等场景可由系统自动查证并执行减免。'},
    {q:'公司处分的种类中，记过对应的处分期间为（　）。', opts:['6 个月','12 个月','18 个月','24 个月'], ans:'B', exp:'处分种类与期间：警告 6 个月、记过 12 个月、记大过 18 个月、降级 24 个月、撤职 24 个月、开除。'},
    {q:'受到记大过处分的，扣减处分决定年度绩效薪酬的（　）。', opts:['10%','20%','30%','40%'], ans:'B', exp:'绩效薪酬扣减：警告 5%、记过 10%、记大过 20%、降级 30%、撤职 40%（+任期激励）、开除 100%。'},
    {q:'受记过处分的员工（　）年度绩效考核不得评为优秀。', opts:['当年','第二年','当年及第二年','第三年'], ans:'A', exp:'受警告、记过处分的当年考核不得评优；受记大过、降级、撤职的当年及第二年不得评优。'},
    {q:'降级、撤职处分期满解除后，下列表述正确的是（　）。', opts:['恢复原职务职级薪酬','不恢复原职务、职级、薪酬待遇等级','自动恢复全部待遇','可重新参评优秀'], ans:'B', exp:'受到降级、撤职公司处分的，处分期满后不恢复受处分前的原职务、职级、薪酬待遇等级。'},
    {q:'下列属于应当从重处分情形的是（　）。', opts:['主动交代问题','配合调查如实说明','阻挠、抵制、串供、包庇同案人员','主动退赔违法所得'], ans:'C', exp:'从重情形：处分期间再次故意违规、阻止他人检举、串供伪造毁灭证据、包庇同案、胁迫唆使、拒不上交退赔等；主动交代、配合调查、主动退赔属于从轻减轻情形。'},
    {q:'「三重一大」决策事项中，「三重」不包括（　）。', opts:['重大决策事项','重要人事任免事项','重大项目安排事项','重要客户投诉事项'], ans:'D', exp:'三重一大：重大决策、重要人事任免、重大项目安排、大额资金使用；重要客户投诉事项不在其中。'},
    {q:'会议制度管理规定中，全省性会议实行严格的计划和审批制度，压缩会议数量与时间，可合并的不单独召开，这体现了（　）。', opts:['精文简会','资金节约','流程优化','考核导向'], ans:'A', exp:'会议制度遵循精文简会原则，严控会议数量时间，能合并不单开，杜绝形式主义。'},
    {q:'公文管理「发文格式」的基本构成要素不包括（　）。', opts:['标题','字号字体','主送机关','落款'], ans:'B', exp:'公文基本构成：标题、主送机关、正文、附件说明、发文机关署名、成文日期、印章等；「字号字体」属于格式排版规范，选项陷阱注意审题。'},

/* ======== 状态 ======== */
let current = null;      // 当前卷数据
let graded = false;      // 是否已批改
let essayScores = {};    // 简答自评分 key: qNo
let isEssay = false;

/* ======== 工具 ======== */
function el(id){ return document.getElementById(id); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ======== 渲染卷选择 ======== */
function paperList(){ return PAPERS.filter(p => p.id && !p.id.startsWith('__')); }

function renderTabs(){
  const wrap = el('tabs');
  wrap.innerHTML = '';
  paperList().forEach((p, i) => {
    if (!p.id) return;
    const d = document.createElement('div');
    d.className = 'tab' + (i === 0 ? ' active' : '');
    d.textContent = p.name;
    d.onclick = () => selectPaper(i);
    wrap.appendChild(d);
  });
}

function selectPaper(i){
  current = paperList()[i];
  graded = false;
  essayScores = {};
  document.querySelectorAll('.tab').forEach((t, j) => t.classList.toggle('active', j === i));
  el('paper-desc').textContent = current.desc;
  el('report').classList.add('hidden');
  el('btn-submit').classList.remove('hidden');
  el('btn-retry').classList.add('hidden');
  renderPaper();
}

/* ======== 渲染题目 ======== */
function renderPaper(){
  const host = el('paper');
  host.innerHTML = '';
  essayScores = {};

  // 单选题
  host.appendChild(sectionHeader('一、单选题（30 题 × 1 分）'));
  current.singles.forEach((x, idx) => {
    host.appendChild(singleCard('s', idx + 1, x));
  });
  // 多选题
  host.appendChild(sectionHeader('二、多选题（30 题 × 2 分）'));
  current.multis.forEach((x, idx) => {
    host.appendChild(multiCard('m', idx + 1, x));
  });
  // 简答题
  host.appendChild(sectionHeader('三、简答题（1 题 × 10 分）'));
  host.appendChild(essayCard(current.essay));
  updateProgress();
}

function sectionHeader(title){
  const d = document.createElement('div');
  d.className = 'section-title';
  d.textContent = title;
  return d;
}

function choiceOf(o, idx){
  // 选项字符串可能已带 "A." 前缀，这里统一生成
  const letters = 'ABCD';
  return { tag: letters[idx], text: o };
}

function cardBase(cls){
  const d = document.createElement('div');
  d.className = 'q-card ' + cls;
  return d;
}

function singleCard(prefix, no, x){
  const card = cardBase('');
  const head = document.createElement('div');
  head.className = 'q-head';
  const label = document.createElement('span');
  label.className = 'q-no';
  label.textContent = no + '.';
  const text = document.createElement('div');
  text.className = 'q-text';
  text.innerHTML = esc(x.q);
  const type = document.createElement('span');
  type.className = 'q-type type-single';
  type.textContent = '单选';
  head.appendChild(label); head.appendChild(text); head.appendChild(type);
  card.appendChild(head);

  const optsDiv = document.createElement('div');
  optsDiv.className = 'opts';
  x.opts.forEach((o, i) => {
    const opt = document.createElement('label');
    opt.className = 'opt';
    opt.dataset.tag = 'ABCD'[i];
    opt.innerHTML = '<input type="radio" name="' + prefix + no + '" value="' + 'ABCD'[i] + '"><span>' + esc('ABCD'[i]) + '. ' + esc(o) + '</span>';
    optsDiv.appendChild(opt);
  });
  card.appendChild(optsDiv);

  const exp = document.createElement('div');
  exp.className = 'explain';
  exp.innerHTML = '<div class="ans-line"></div><div class="exp-body"></div>';
  card.appendChild(exp);
  card.dataset.no = prefix + no;
  return card;
}

/* ======== 进度 ======== */
function updateProgress(){
  const totalS = current.singles.length, totalM = current.multis.length;
  let done = 0;
  document.querySelectorAll('#paper input[type=radio]').forEach(i => { if (i.checked) done++; });
  // 多选按题统计：只要该题勾了任意项即计 1
  document.querySelectorAll('#paper .q-card[data-no^="m"]').forEach(card => {
    if (card.querySelector('input[type=checkbox]:checked')) done++;
  });
  const essayVal = el('essay-input') ? el('essay-input').value.trim() : '';
  if (essayVal) done++;
  const total = totalS + totalM + 1;
  el('progress').textContent = '已作答 ' + done + ' / ' + total;
}

/* ======== 批改（同步执行，逻辑简单可靠） ======== */
function grade(){
  if (!current) return;
  let sScore = 0, mScore = 0, eScore = 0;
  const wrongs = [];

  // 单选
  current.singles.forEach((x, idx) => {
    const card = document.querySelector('#paper .q-card[data-no="s' + (idx+1) + '"]');
    const checked = card.querySelector('input:checked');
    const userAns = checked ? checked.value : '';
    const isRight = userAns === x.ans;
    if (isRight) sScore += 1; else wrongs.push('s' + (idx+1));
    gradeCard(card, {type:'single', right: isRight, userAns, ans: x.ans, exp: x.exp});
  });

  // 多选
  current.multis.forEach((x, idx) => {
    const card = document.querySelector('#paper .q-card[data-no="m' + (idx+1) + '"]');
    const checked = Array.from(card.querySelectorAll('input:checked')).map(i => i.value).sort();
    // 规范化正确答案：支持 ['ABC'] 或 ['A','B'] 或 'ABC' 或 'AB'
    const stdRaw = Array.isArray(x.ans) ? x.ans.join('') : String(x.ans || '');
    const std = stdRaw.split('').sort();
    let right = checked.length === std.length && checked.every((v, k) => v === std[k]);
    let score = 0;
    if (right) score = 2;
    else if (checked.length > 0 && checked.every(v => std.includes(v))) score = 1; // 漏选
    if (score > 0) mScore += score; else wrongs.push('m' + (idx+1));
    gradeCard(card, {type:'multi', right, score, userAns: checked, ans: std, exp: x.exp});
  });

  // 简答
  const essayScore = parseFloat((el('essay-score') ? el('essay-score').value : '0') || '0');
  eScore = Math.min(10, Math.max(0, essayScore));
  const essayInputEl = el('essay-input');
  const essayCardEl = essayInputEl ? essayInputEl.closest('.q-card') : null;
  if (essayCardEl) gradeEssay(essayCardEl, current.essay, eScore);

  const total = sScore + mScore + eScore;
  showReport(total, sScore, mScore, eScore, wrongs);
  graded = true;
  const sb = el('btn-submit'); if (sb) sb.classList.add('hidden');
  const rb = el('btn-retry'); if (rb) rb.classList.remove('hidden');
  try { window.scrollTo(0, 0); } catch (e) {}
}

function gradeCard(card, info){
  card.classList.add('graded');
  card.classList.add(info.right ? 'correct' : 'wrong');
  const ansLine = card.querySelector('.ans-line');
  const expBody = card.querySelector('.exp-body');
  if (info.type === 'single') {
    ansLine.className = 'ans-line ' + (info.right ? 'correct' : 'wrong');
    ansLine.textContent = (info.right ? '✓ 回答正确，答案：' : '✗ 回答错误，正确答案：') + info.ans;
  } else {
    if (info.right) { ansLine.className = 'ans-line correct'; ansLine.textContent = '✓ 回答正确（满分 2 分），答案：' + info.ans.join(''); }
    else if (info.score === 1) { ansLine.className = 'ans-line correct'; ansLine.textContent = '○ 部分正确（漏选，得 1 分），正确答案：' + info.ans.join('') + '，你选了：' + (info.userAns.join('') || '未选'); }
    else { ansLine.className = 'ans-line wrong'; ansLine.textContent = '✗ 回答错误（0 分），正确答案：' + info.ans.join('') + '，你选了：' + (info.userAns.join('') || '未选'); }
  }
  expBody.innerHTML = '<div style="font-weight:700;color:#0b3f8f;margin:2px 0 4px;">— 解析 —</div>' + esc(info.exp).replace(/\n/g, '<br>');
  // 选项标色
  const opts = card.querySelectorAll('.opt');
  opts.forEach(o => {
    const tag = o.dataset.tag;
    if (info.type === 'single') {
      if (tag === info.ans) o.classList.add('opt-correct');
      if (tag === info.userAns && !info.right) o.classList.add('opt-wrong');
    } else {
      if (info.ans.includes(tag)) o.classList.add('opt-correct');
      if (info.userAns && !info.ans.includes(tag) && info.userAns.includes(tag)) o.classList.add('opt-wrong');
    }
  });
  card.querySelectorAll('input').forEach(i => i.disabled = true);
}

function gradeEssay(card, x, score){
  card.classList.add('graded');
  card.classList.add('correct');
  const ansLine = card.querySelector('.ans-line');
  ansLine.className = 'ans-line correct';
  ansLine.textContent = '简答自评得分：' + score + ' / 10';
  const expBody = card.querySelector('.exp-body');
  let html = '<div style="font-weight:700;color:#0b3f8f;margin:2px 0 4px;">— 参考答案 —</div>';
  if (x && x.ref) html += esc(x.ref).replace(/\n/g, '<br>');
  if (x && x.points) {
    html += '<div style="font-weight:700;color:#0b3f8f;margin:8px 0 4px;">— 评分要点 —</div><ol>';
    x.points.forEach(p => { html += '<li>' + esc(p) + '</li>'; });
    html += '</ol>';
  }
  expBody.innerHTML = html;
  el('essay-input').disabled = true;
  el('essay-score').disabled = true;
}

/* ======== 成绩报告 ======== */
function showReport(total, s, m, e, wrongs){
  const rep = el('report');
  rep.classList.remove('hidden');
  const pass = total >= 60;
  rep.innerHTML = '';
  const h = document.createElement('h2');
  h.textContent = '成绩报告';
  rep.appendChild(h);
  const sl = document.createElement('div');
  sl.className = 'score-line';
  const mk = (num, label) => {
    const b = document.createElement('div');
    b.className = 'score-box ' + (label.indexOf('总分') >= 0 ? (pass ? 'pass' : 'fail') : '');
    b.innerHTML = '<div class="num">' + num + '</div><div class="label">' + label + '</div>';
    return b;
  };
  sl.appendChild(mk(total + ' 分', '总分（100）'));
  sl.appendChild(mk(s + ' 分', '单选（30）'));
  sl.appendChild(mk(m + ' 分', '多选（60）'));
  sl.appendChild(mk(e + ' 分', '简答（10）'));
  rep.appendChild(sl);

  const verdict = document.createElement('p');
  verdict.style.textAlign = 'center';
  verdict.style.fontSize = '16px';
  verdict.style.fontWeight = '700';
  verdict.style.color = pass ? '#1a7f37' : '#c2272d';
  verdict.textContent = pass ? '恭喜，本次得分达到 60 分合格线！🎉' : '未达 60 分合格线，建议重做并重点复习错题解析。';
  rep.appendChild(verdict);

  const wrongCount = wrongs.length;
  const wInfo = document.createElement('p');
  wInfo.style.textAlign = 'center';
  wInfo.style.color = '#4a5c75';
  wInfo.style.fontSize = '14px';
  wInfo.textContent = '共答错 ' + wrongCount + ' 题（含漏选与错选），错题清单如下，点击可跳转查看解析：';
  rep.appendChild(wInfo);

  if (wrongCount > 0) {
    const list = document.createElement('div');
    list.className = 'mistake-list';
    wrongs.forEach(code => {
      const it = document.createElement('div');
      it.className = 'mistake-item';
      const a = document.createElement('a');
      const isS = code.startsWith('s');
      const no = parseInt(code.slice(1), 10);
      a.textContent = (isS ? '单选题 ' : '多选题 ') + no + ' 题';
      a.href = '#';
      a.onclick = (ev) => {
        ev.preventDefault();
        const target = document.getElementById('paper').querySelector('.q-card[data-no="' + code + '"]');
        if (target) target.scrollIntoView(true);
      };
      it.appendChild(a);
      // 附正确答案与题干摘要
      const target = document.getElementById('paper').querySelector('.q-card[data-no="' + code + '"]');
      const qText = target ? (target.querySelector('.q-text').textContent || '') : '';
      it.appendChild(document.createTextNode(' — ' + qText.slice(0, 34) + (qText.length > 34 ? '…' : '')));
      list.appendChild(it);
    });
    rep.appendChild(list);
  }

  const action = document.createElement('div');
  action.className = 'action-row';
  const btnAgain = document.createElement('button');
  btnAgain.className = 'btn btn-secondary';
  btnAgain.textContent = '再看一遍我的答卷';
  btnAgain.onclick = () => { rep.classList.add('hidden'); el('btn-retry').classList.remove('hidden'); try { window.scrollTo(0, 0); } catch (e) {} };
  action.appendChild(btnAgain);
  rep.appendChild(action);
}

/* ======== 重置 ======== */
function resetPaper(){
  if (el('report')) el('report').classList.add('hidden');
  const sb = el('btn-submit'); if (sb) sb.classList.remove('hidden');
  const rb = el('btn-retry'); if (rb) rb.classList.add('hidden');
  renderPaper();
}

/* ======== 实时进度 ======== */
document.addEventListener('change', (ev) => {
  if (ev.target.matches('#paper input') && !graded) updateProgress();
});
document.addEventListener('input', (ev) => {
  if (ev.target.id === 'essay-input' && !graded) updateProgress();
});

/* ======== 启动 ======== */
renderTabs();
selectPaper(0);
